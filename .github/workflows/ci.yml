name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest

    # Tests launch isolated replica sets using the binary inside this container.
    container: mongo:7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run server integration test suite
        run: npm --prefix server test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/ci_test
          JWT_ACCESS_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210

  frontend-test-and-build:
    name: Frontend Tests & Production Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run client session tests
        run: npm --prefix client test

      - name: Verify production Vite bundle
        run: npm --prefix client run build

